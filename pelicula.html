<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Película — MyLetterboxd</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&amp;family=Lora:wght@400;700&amp;display=swap" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-md sticky-top ml-nav" aria-label="Principal">
      <div class="container-fluid px-3 px-md-4">
        <a class="navbar-brand ml-logo" href="index.html">MyLetterboxd</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav mx-md-auto ml-nav-links">
            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#catalogo">Películas</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#favoritas">Favoritas</a></li>
          </ul>
          <form class="d-flex" action="index.html" method="get" role="search">
            <label class="visually-hidden" for="buscar">Buscar por título o género</label>
            <input class="form-control form-control-sm" id="buscar" name="q" type="search" placeholder="Buscar título o género" autocomplete="off">
          </form>
        </div>
      </div>
    </nav>
  </header>

  <main class="container ml-section">
    <p><a class="ml-back" id="volver" href="index.html#catalogo">← Volver al catálogo</a></p>
    <div id="detalle"></div>
  </main>

  <footer class="ml-footer">
    <div class="container">
      <p class="mb-0">MyLetterboxd — proyecto académico inspirado en Letterboxd. Datos guardados solo en este navegador. Pósteres de <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>; este producto usa la API de TMDB, pero no está respaldado ni certificado por TMDB.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/peliculas.js"></script>
  <script src="js/config.js"></script>
  <script src="js/tmdb.js"></script>
  <script src="js/detalle.js"></script>
